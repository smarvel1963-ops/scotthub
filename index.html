<!doctype html>
<!-- SAVE AS: index.html  ·  LOCATION: C:/MarvelApps/scotthub/index.html
     SCOTT HUB - Scott's PRIVATE away-from-home app (Scott 2026-10-10: "a personalize app for myself giving me
     updates on things i need to know when not home"). This page holds NO data: the numbers come from Scott's
     own Apps Script relay (relay/Code.gs) and only with the read pass, which arrives once through a #k= link
     and stays on the phone. Hub family layout: top = clock + scene, middle = what needs you, bottom = bubbles. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Scott Hub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="hero" class="hero">
    <div class="scene" aria-hidden="true"></div>
    <div class="hero-in">
      <div class="hello" id="hello">Scott Hub</div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="fresh" id="fresh">connecting…</div>
    </div>
  </header>

  <main>
    <section class="band" aria-label="What needs you">
      <h2>What needs you</h2>
      <ul id="needs" class="needs"><li class="muted">Loading…</li></ul>
    </section>

    <section class="band" aria-label="At a glance">
      <div id="glance" class="glance"></div>
    </section>

    <nav class="bubbles" aria-label="Sections">
      <button data-open="bets"><span>🎯</span>Bets</button>
      <button data-open="health"><span>🩺</span>Health</button>
      <button data-open="money"><span>💵</span>Money</button>
      <button data-open="business"><span>📈</span>Business</button>
      <button data-open="calendar"><span>📅</span>Calendar</button>
      <button data-open="todo"><span>✅</span>To-do</button>
      <button data-act="refresh"><span>🔄</span>Refresh</button>
    </nav>
  </main>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-body">
      <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" data-act="close" aria-label="Close">✕</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="setup" class="setup hidden">
    <h1>Scott Hub</h1>
    <p>This phone isn't set up yet. Open the setup link from your email on this phone, once.</p>
    <p class="muted">The link carries your private read pass. It stays on this phone and is never shown.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
